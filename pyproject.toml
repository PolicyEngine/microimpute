[build-system]
requires = [
  "setuptools>=61.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "microimpute"
version = "3.1.0"
description = "Benchmarking imputation methods for microdata"
readme = "README.md"
authors = [
    { name = "María Juaristi", email = "juaristi@uni.minerva.edu" },
    { name = "Nikhil Woodruff", email = "nikhil.woodruff@outlook.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.2.0,<4.0.0",
    "plotly>=5.24.0,<7.0.0",
    "scikit-learn>=1.7.0,<1.9.0",
    "scipy>=1.16.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "statsmodels>=0.14.5,<0.16.0",
    "quantile-forest>=1.4.1,<1.5.0",
    "pydantic>=2.8.0,<3.0.0",
    "optuna>=4.3.0,<5.0.0",
    "joblib>=1.5.0,<2.0.0",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.2.3,<2.0.0",
    "build>=1.2.0,<2.0.0",
    "towncrier>=24.8.0",
]

matching = [
    "rpy2>=3.5.0,<4.0.0",
]

mdn = [
    "pytorch-tabular>=1.1.0",
    "torch>=2.0.0",
]

docs = [
    "jupyter-book",
    "furo>=2024.0.0",  # Sphinx theme for documentation
    "ipywidgets>=8.0.0,<9.0.0",
    "plotly>=5.24.0,<7.0.0",
    "h5py>=3.1.0,<4.0.0",
]

images = [
    "kaleido>=0.2.1,<0.3.0",  # For exporting plots as PNG/JPG
]

[tool.setuptools]
packages = ["microimpute"]
include-package-data = true

[tool.setuptools.package-data]
"microimpute" = ["**/*"]

[tool.towncrier]
package = "microimpute"
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = ""
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true
